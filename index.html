
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHIFTBEASTS 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9df;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#top{position:absolute;top:15px;left:0;right:0;text-align:center;text-shadow:0 2px 5px #111;pointer-events:none}
h1{font-size:25px;letter-spacing:3px;margin:0}
#info{margin-top:8px;font-size:13px}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 20px;gap:12px}
.group{display:flex;gap:10px}
button{border:1px solid #5de6ff;background:#101b2bdc;color:white;border-radius:14px;padding:18px 21px;font-size:17px;font-weight:bold;touch-action:none}
button:active{background:#00bce9;color:#06121c}
#gas{background:#00bce9;color:#07131f;min-width:100px}
#hint{position:absolute;bottom:105px;left:0;right:0;text-align:center;font-size:12px;color:white;text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
  <h1>SHIFTBEASTS</h1>
  <div id="info">3D CITY • FREE DRIVE</div>
</div>
<div id="hint">Hold GAS to drive • Use arrows to steer</div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <button id="gas">GAS ▲</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9ee);
scene.fog = new THREE.Fog(0x91c9ee, 65, 210);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 350
);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'low-power'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x56616c, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-20, 35, 15);
scene.add(sun);

function material(color) {
  return new THREE.MeshStandardMaterial({color, roughness:0.85});
}
const grassMat = material(0x638b55);
const roadMat = material(0x30343b);
const lineMat = material(0xf2f2ed);
const sidewalkMat = material(0xb5b7b4);

function box(w,h,d,x,y,z,mat,parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), mat
  );
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

// Ground and long city road

box(10000, 0.2, 10000, 0, -0.2, -4900, grassMat);
box(13, 0.12, 10000, 0, 0, -4900, roadMat);
box(1.2, 0.2, 10000, -7.1, 0, -4900, sidewalkMat);
box(1.2, 0.2, 10000, 7.1, 0, -4900, sidewalkMat);

const roadDashes = [];

for (let z = 12; z > -390; z -= 10) {
  const dash = box(0.16, 0.04, 4, 0, 0.09, z, lineMat);
  roadDashes.push(dash);
}
  


const buildingMats = [
  0x303e50, // midnight blue
  0x596979, // steel grey
  0x9a8875, // warm stone
  0x354e59, // deep teal
  0xb0b4b8, // silver concrete
  0x454958  // graphite
].map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.72,
  metalness: 0.12
}));

const cityRows = [];

const winMat = new THREE.MeshStandardMaterial({
  color: 0x9be7ff,
  emissive: 0x236a91,
  emissiveIntensity: 0.45,
  metalness: 0.25,
  roughness: 0.22
});

const darkGlass = new THREE.MeshStandardMaterial({
  color: 0x142b40,
  metalness: 0.55,
  roughness: 0.2
});

const balconyMat = material(0x263544);
const shopMat = material(0x202c38);
const signMat = new THREE.MeshStandardMaterial({
  color: 0xffbd68,
  emissive: 0x9b5018,
  emissiveIntensity: 0.5
});

const poleMat = material(0x26303b);
const lampMat = new THREE.MeshStandardMaterial({
  color: 0xffe4a1,
  emissive: 0xffb64d,
  emissiveIntensity: 1.2
});
const leafMat = material(0x285b43);
const trunkMat = material(0x60432e);

function makeCityRow(z) {
  const row = new THREE.Group();
  row.position.z = z;
  scene.add(row);

  for (const side of [-1, 1]) {
    const w = 7 + Math.random() * 5;
    const h = 13 + Math.random() * 17;
    const d = 9 + Math.random() * 5;
    const x = side * (11 + w / 2 + Math.random() * 3);

    // Main building
    box(
      w, h, d, x, h / 2, 0,
      buildingMats[Math.floor(Math.random() * buildingMats.length)],
      row
    );

    // Road-facing glass windows and balconies
    const faceX = x - side * (w / 2 + 0.06);
    const floors = Math.floor(h / 2.5);

    for (let floor = 1; floor < floors; floor++) {
      for (let col = 0; col < 3; col++) {
        const winZ = -d / 2 + 1.6 + col * ((d - 3.2) / 2);
        const winY = floor * 2.35;

        box(
          0.09, 1.25, 1.15,
          faceX, winY, winZ,
          darkGlass, row
        );

        box(
          0.12, 0.88, 0.82,
          faceX - side * 0.07, winY, winZ,
          winMat, row
        );

        // Balcony slab
        if (floor % 2 === 0 && col !== 1) {
          box(
            0.5, 0.12, 1.55,
            faceX - side * 0.2,
            winY - 0.72, winZ,
            balconyMat, row
          );

          box(
            0.08, 0.48, 1.5,
            faceX - side * 0.42,
            winY - 0.43, winZ,
            balconyMat, row
          );
        }
      }
    }

    // Ground-floor shop
    box(
      0.14, 2.5, d * 0.68,
      faceX - side * 0.08, 1.35, 0,
      shopMat, row
    );

    // Warm shop display windows
    for (let s = -1; s <= 1; s++) {
      box(
        0.12, 1.25, 1.4,
        faceX - side * 0.16, 1.25, s * 2,
        signMat, row
      );
    }

    // Shop canopy
    box(
      0.85, 0.16, d * 0.76,
      faceX - side * 0.35, 2.75, 0,
      material(0x263e55), row
    );

    // Rooftop architectural detail
    box(
      w * 0.58, 0.35, d * 0.48,
      x, h + 0.18, 0,
      balconyMat, row
    );

    // Streetlight pole
    box(
      0.13, 4.1, 0.13,
      side * 8.1, 2.05, 0,
      poleMat, row
    );

    box(
      0.85, 0.12, 0.12,
      side * 7.75, 4.05, 0,
      poleMat, row
    );

    box(
      0.4, 0.13, 0.28,
      side * 7.4, 4.0, 0,
      lampMat, row
    );

    // Decorative trees
    if (Math.random() > 0.25) {
      const treeX = side * 8.8;

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.22, 1.7, 8),
        trunkMat
      );
      trunk.position.set(treeX, 0.85, 5);
      row.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(0.95, 10, 8),
        leafMat
      );
      leaves.position.set(treeX, 2.25, 5);
      row.add(leaves);

      // Planter
      box(
        1.25, 0.45, 1.25,
        treeX, 0.23, 5,
        material(0x626e70), row
      );
    }
  }

  cityRows.push(row);
}

for (let z = 5; z > -410; z -= 22) {
  makeCityRow(z);
}


    
            // Detailed building windows
            const winMat = material(0x8ce8ff);
            const darkWinMat = material(0x172b3b);
            
            for (let floor = 1; floor < h / 2; floor += 2) {
              for (let col = 0; col < 2; col++) {
                const winX = x - w / 2 + 1.3 + col * (w - 2.6);
                const winY = floor * 2.1;
                
                // Dark window frame
                box(
                  1.05, 1.15, 0.12,
                  winX, winY, d / 2 + 0.05,
                  darkWinMat, row
                );
                
                // Bright glass
                box(
                  0.82, 0.9, 0.14,
                  winX, winY, d / 2 + 0.13,
                  winMat, row
                );
                
                // Balcony ledge
                box(
                  1.45, 0.12, 0.45,
                  winX, winY - 0.68, d / 2 + 0.25,
                  poleMat, row
                );
              }
            }


    // Streetlights beside the road
    box(0.14, 4.5, 0.14, side * 8.1, 2.25, 0, poleMat, row);
    box(0.85, 0.12, 0.12, side * 7.75, 4.4, 0, poleMat, row);
    box(0.35, 0.14, 0.28, side * 7.4, 4.35, 0, lampMat, row);

    // Trees on every third city row
    if (Math.round(Math.abs(z) / 22) % 3 === 0) {
      const treeX = side * 8.8;

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.25, 2, 6),
        trunkMat
      );
      trunk.position.set(treeX, 1, 5);
      row.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.25, 7, 6),
        leafMat
      );
      leaves.position.set(treeX, 2.8, 5);
      row.add(leaves);
    }
  }

  cityRows.push(row);
}

// Extend the city farther into the distance
for (let z = 5; z > -1300; z -= 22) {
  makeCityRow(z);
}


// Car group
const car = new THREE.Group();
scene.add(car);

const blue = new THREE.MeshStandardMaterial({
  color:0x087ff5,metalness:0.45,roughness:0.3
});
const glass = material(0x172b3b);
const black = material(0x17191d);
const wheelGeo = new THREE.CylinderGeometry(0.38,0.38,0.28,12);

box(2.05,0.55,4,0,0.65,0,blue,car);
box(1.5,0.58,1.8,0,1.15,-0.35,glass,car);
box(1.85,0.17,1.0,0,0.95,-1.4,blue,car);

for(const x of [-1,1]){
  for(const z of [-1.3,1.3]){
    const wheel=new THREE.Mesh(wheelGeo,black);
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x*1.05,0.4,z);
    car.add(wheel);
  }
}
box(0.42,0.17,0.08,-0.62,0.76,-2.02,
  material(0xffffff),car);
box(0.42,0.17,0.08,0.62,0.76,-2.02,
  material(0xffffff),car);

car.position.set(0,0,2);

// Mobile and keyboard controls
let left=false, right=false, gas=false;
let speed=0;
let distance=0;

function hold(id,setter){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    setter(true);
    el.setPointerCapture(e.pointerId);
  });
  const stop=e=>{
    e.preventDefault();
    setter(false);
  };
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointercancel',stop);
  el.addEventListener('lostpointercapture',()=>setter(false));
}
hold('left',v=>left=v);
hold('right',v=>right=v);
hold('gas',v=>gas=v);

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;
  if(e.key==='ArrowUp'||e.key==='w')gas=true;
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
  if(e.key==='ArrowUp'||e.key==='w')gas=false;
});

function animate(){
  requestAnimationFrame(animate);

  if(gas) speed=Math.min(speed+0.006,0.42);
  else speed=Math.max(speed-0.004,0);

  if(left) car.position.x-=0.12;
  if(right) car.position.x+=0.12;

  car.position.x=Math.max(-4.8,Math.min(4.8,car.position.x));
  car.position.z-=speed;
  distance+=speed;

  // Recycle the road markings for a continuing road
  scene.children.forEach(obj=>{
    if(obj.userData.roadDash && obj.position.z>car.position.z+8){
      obj.position.z-=400;
    }
  });

  camera.position.x+=(car.position.x*0.45-camera.position.x)*0.06;
  camera.position.y=6.2;
  camera.position.z=car.position.z+10;
  camera.lookAt(car.position.x,0.6,car.position.z-7);

  document.getElementById('info').textContent=
    '3D CITY • DISTANCE '+Math.floor(distance)+' M';

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
